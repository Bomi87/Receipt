<!doctype html>
<html lang="ko">
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>영수증 비용관리</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        font-family: Arial;
        margin: 0;
        background: #f4f7fa;
        color: #18293b;
        overflow-x: hidden;
      }
      header {
        background: #14263c;
        color: #fff;
        padding: 18px;
      }
      main {
        width: 100%;
        max-width: 1050px;
        margin: auto;
        padding: 18px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
      }
      .tabs button,
      .primary {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .primary,
      .tabs .on {
        background: #2676ed;
        color: #fff;
      }
      .panel {
        background: #fff;
        border: 1px solid #e1e7ed;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .cards b {
        display: block;
        font-size: 22px;
        margin-top: 9px;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(7, minmax(110px, 1fr));
        gap: 10px;
        align-items: end;
      }
      .filters label {
        font-size: 12px;
        color: #607286;
      }
      .filters select,
      .filters button {
        width: 100%;
        height: 40px;
        margin-top: 5px;
        border: 1px solid #d7e0e8;
        border-radius: 8px;
        background: #fff;
        padding: 0 9px;
        font-size: 16px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .chart-title {
        margin: 0 0 16px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: minmax(80px, 130px) 1fr auto;
        gap: 10px;
        align-items: center;
        margin: 11px 0;
        font-size: 13px;
      }
      .bar-track {
        height: 16px;
        background: #edf2f7;
        border-radius: 8px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        min-width: 3px;
        border-radius: 8px;
        background: linear-gradient(90deg, #2676ed, #61a0ff);
      }
      .bar-fill.green {
        background: linear-gradient(90deg, #12a06a, #58c99d);
      }
      .bar-fill.orange {
        background: linear-gradient(90deg, #ef8a27, #ffc15c);
      }
      .empty {
        padding: 28px 0;
        text-align: center;
        color: #8291a1;
      }
      .rank-table td:last-child,
      .rank-table th:last-child {
        text-align: right;
      }
      .breakdown-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }
      .breakdown-tabs button {
        border: 1px solid #d7e0e8;
        border-radius: 20px;
        background: #fff;
        padding: 9px 15px;
        color: #36506b;
      }
      .breakdown-tabs button.on {
        border-color: #2676ed;
        background: #2676ed;
        color: #fff;
      }
      .criteria-picker {
        border: 1px solid #d7e0e8;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 16px;
        background: #f8fafc;
      }
      .criteria-picker-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .criteria-picker-head button {
        border: 0;
        border-radius: 7px;
        padding: 7px 10px;
      }
      .criteria-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 7px;
      }
      .criteria-actions .clear-all {
        background: #2676ed;
        color: #fff;
      }
      .criteria-options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-height: 160px;
        overflow: auto;
      }
      .criteria-options label {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7e0e8;
        border-radius: 18px;
        background: #fff;
        padding: 7px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      .criteria-summary {
        margin: 0 0 14px;
        color: #52677d;
        font-size: 13px;
      }
      .clickable {
        cursor: pointer;
        padding: 5px;
        border-radius: 7px;
      }
      .clickable:hover {
        background: #f4f7fa;
      }
      .detail-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .detail-head button {
        border: 0;
        border-radius: 7px;
        padding: 8px 11px;
      }
      .scan {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .drop {
        min-height: 420px;
        border: 2px dashed #becbd7;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .drop img {
        max-width: 100%;
        max-height: 390px;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 14px;
        align-content: start;
      }
      .form label {
        display: block;
        min-width: 0;
        color: #52677d;
        font-size: 13px;
        font-weight: 600;
      }
      .form input,
      .form select {
        display: block;
        width: 100%;
        min-width: 0;
        height: 48px;
        margin-top: 7px;
        border: 1px solid #d7e0e8;
        border-radius: 9px;
        background: #fff;
        color: #18293b;
        padding: 0 12px;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.2;
      }
      .form input:focus,
      .form select:focus {
        border-color: #2676ed;
        outline: 3px solid rgba(38, 118, 237, 0.12);
      }
      .form input[type="hidden"] {
        display: none;
      }
      .form .primary {
        width: 100%;
        min-height: 48px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .form-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .secondary,
      .danger,
      .table-action {
        border: 0;
        border-radius: 8px;
        padding: 9px 11px;
        cursor: pointer;
      }
      .secondary,
      .table-action {
        background: #edf2f7;
        color: #29435f;
      }
      .danger {
        background: #e5484d;
        color: #fff;
      }
      .row-actions {
        display: flex;
        gap: 6px;
        white-space: nowrap;
      }
      .row-actions .danger,
      .row-actions .table-action {
        padding: 6px 9px;
        font-size: 12px;
      }
      .wide {
        grid-column: 1/-1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #edf0f3;
        text-align: left;
      }
      @media (max-width: 700px) {
        .cards {
          grid-template-columns: 1fr 1fr;
        }
        .scan {
          grid-template-columns: 1fr;
        }
        .form {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .form .wide {
          grid-column: auto;
        }
        .drop {
          min-height: 300px;
        }
        .filters {
          grid-template-columns: 1fr 1fr;
        }
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
        .bar-row {
          grid-template-columns: 80px 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <header><b>Receipt Flow</b>　영수증 비용관리</header>
    <main>
      <div class="tabs">
        <button id="tabDash" onclick="show('dash', this)" class="on">대시보드</button
        ><button id="tabScan" onclick="show('scan', this)">영수증 스캔</button
        ><button id="tabList" onclick="show('list', this)">영수증 내역</button>
      </div>
      <section id="dash">
        <div class="panel filters">
          <label>연도<select id="filterYear" onchange="applyDashboardFilters()"></select></label>
          <label>월<select id="filterMonth" onchange="applyDashboardFilters()"></select></label>
          <label>사용자<select id="filterEmployee" onchange="applyDashboardFilters()"></select></label>
          <label>소속<select id="filterDepartment" onchange="applyDashboardFilters()"></select></label>
          <label>비용분류<select id="filterCategory" onchange="applyDashboardFilters()"></select></label>
          <label>통화<select id="filterCurrency" onchange="applyDashboardFilters()"></select></label>
          <button type="button" onclick="resetDashboardFilters()">필터 초기화</button>
        </div>
        <div class="cards">
          <article class="panel">총 결제금액<b id="total">0원</b></article>
          <article class="panel">등록 영수증<b id="count">0건</b></article>
        </div>
        <div class="panel">
          <h3 class="chart-title">사용자별 지출 현황</h3>
          <div id="breakdownChart"></div>
        </div>
        <div id="dashboardReceiptPanel" class="panel" style="overflow:auto">
          <h3 id="dashboardReceiptTitle" class="chart-title">결과 Data</h3>
          <table class="rank-table">
            <thead><tr><th>구매일시</th><th>사용자</th><th>구매처</th><th>분류</th><th>승인번호</th><th>금액</th><th>관리</th></tr></thead>
            <tbody id="rankingRows"></tbody>
          </table>
        </div>
      </section>
      <section id="scan" hidden>
        <div class="scan">
          <div class="panel drop" onclick="file.click()">
            <div id="photo">
              <h2>⌁</h2>
              <b>영수증 촬영</b>
              <p>눌러서 카메라를 실행하세요.</p>
            </div>
            <input
              id="file"
              hidden
              type="file"
              accept="image/*"
              capture="environment"
            />
          </div>
          <form class="panel form" onsubmit="save(event)">
            <label>
              구매일자
              <input id="purchaseDate" type="date" required />
            </label>
            <label>
              구매시간
              <input id="purchaseTime" type="time" />
            </label>
            <label class="wide">
              구매자
              <select id="buyerName" onchange="syncEmp()"></select>
            </label>
            <input id="employeeId" type="hidden" />
            <input id="editingReceiptId" type="hidden" />
            <input id="editingReceiptVersion" type="hidden" />
            <label class="wide">
              구매처
              <input id="merchant" required />
            </label>
            <label>
              비용 분류
              <select id="category"></select>
            </label>
            <label>
              세부 분류
              <input id="subcategory" />
            </label>
            <label class="wide">
              승인번호
              <input id="approvalNumber" />
            </label>
            <label>
              통화
              <input id="currencyCode" maxlength="3" value="KRW" required />
            </label>
            <label>
              결제금액
              <input id="amount" type="number" step="0.01" min="0" required />
            </label>
            <button id="saveButton" class="primary wide">확인 후 저장</button>
            <div id="editActions" class="form-actions wide" hidden>
              <button type="button" class="secondary" onclick="cancelEdit()">수정 취소</button>
              <button type="button" class="danger" onclick="deleteEditingReceipt()">이 영수증 삭제</button>
            </div>
          </form>
        </div>
      </section>
      <section id="list" hidden>
        <div class="panel" style="overflow: auto">
          <table>
            <thead>
              <tr>
                <th>구매일시</th>
                <th>사용자</th>
                <th>구매처</th>
                <th>분류</th>
                <th>승인번호</th>
                <th>금액</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      // Apps Script에서 웹 앱으로 배포한 /exec 주소를 입력하세요.
      const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw1Faxi5ZdRbLfbcdybAJLe-X7qFbR5iYoCOLhvtK0gI-2tjGEO9sAc3CEfXf_xv0J7/exec";

   
      let app = {};
      let image = "";

      const $ = (id) => document.getElementById(id);
      const won = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";
      const currencyOf = (r) => String(r["통화"] || "KRW").toUpperCase();
      const money = (n, code) => Number(n || 0).toLocaleString("ko-KR", {
        maximumFractionDigits: ["KRW", "JPY", "VND"].includes(code) ? 0 : 2,
      }) + " " + code;
      const DEPARTMENTS = ["담당", "팀장", "기획", "객실", "정비", "운항관리", "조종", "헬기"];
      const breakdownKey = "이름";

      function show(id, b) {
        ["dash", "scan", "list"].forEach((x) => ($(x).hidden = x !== id));
        document
          .querySelectorAll(".tabs button")
          .forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
      }
      function checkBackendUrl() {
        if (!BACKEND_URL.startsWith("https://script.google.com/macros/s/")) {
          throw new Error(
            "프론트 코드 상단의 BACKEND_URL에 Apps Script /exec 주소를 입력하세요.",
          );
        }
      }

      function jsonp(action, params = {}) {
        checkBackendUrl();
        return new Promise((resolve, reject) => {
          const callbackName =
            "receiptCallback_" +
            Date.now() +
            "_" +
            Math.random().toString(36).slice(2);
          const script = document.createElement("script");
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("백엔드 응답 시간이 초과되었습니다."));
          }, 60000);

          function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
          }

          window[callbackName] = (response) => {
            cleanup();
            response.ok
              ? resolve(response)
              : reject(new Error(response.error || "요청에 실패했습니다."));
          };

          const query = new URLSearchParams({
            action,
            callback: callbackName,
            ...params,
          });
          script.onerror = () => {
            cleanup();
            reject(new Error("백엔드에 연결할 수 없습니다."));
          };
          script.src = BACKEND_URL + "?" + query.toString();
          document.head.appendChild(script);
        });
      }

      async function postJob(action, values) {
        checkBackendUrl();
        const requestId =
          Date.now().toString(36) + Math.random().toString(36).slice(2);
        const body = new URLSearchParams({
          action,
          requestId,
          ...values,
        });

        fetch(BACKEND_URL, {
          method: "POST",
          mode: "no-cors",
          body,
        }).catch(() => {});

        for (let i = 0; i < 180; i += 1) {
          await new Promise((resolve) => setTimeout(resolve, 700));
          const result = await jsonp("status", { requestId });
          if (result.state === "done") return result.data;
          if (result.state === "error") {
            throw new Error(result.error || "처리 중 오류가 발생했습니다.");
          }
        }
        throw new Error("처리 시간이 초과되었습니다. 다시 시도해 주세요.");
      }

      async function init() {
        try {
          const response = await jsonp("initial");
          const d = response.data;
          app = d;
          $("buyerName").innerHTML = '<option value="">구매자를 선택하세요</option>' + d.employees
            .map(
              (e) =>
                '<option value="' +
                e.name +
                '">' +
                e.name +
                " / " +
                e.employeeId +
                " / " +
                e.department +
                "</option>",
            )
            .join("");
          $("category").innerHTML = d.categories
            .map((x) => "<option>" + x + "</option>")
            .join("");
          setupDashboardFilters();
          $("buyerName").value = "";
          $("employeeId").value = "";
          render(d);
        } catch (err) {
          alert(err.message);
        }
      }

      function syncEmp() {
        let e = app.employees?.find((x) => x.name == $("buyerName").value);
        $("employeeId").value = e ? e.employeeId : "";
      }
      const escapeHtml = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      function uniqueValues(rows, key) {
        return [...new Set(rows.map((r) => String(r[key] || "")).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
      }

      function fillFilter(id, values, allLabel, selectedValue = "") {
        $(id).innerHTML =
          '<option value="">' + allLabel + "</option>" +
          values.map((v) => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>").join("");
        $(id).value = values.includes(selectedValue) ? selectedValue : "";
      }

      function setupDashboardFilters() {
        refreshDashboardFilterOptions();
      }

      function resetDashboardFilters() {
        ["filterYear", "filterMonth", "filterEmployee", "filterDepartment", "filterCategory", "filterCurrency"]
          .forEach((id) => ($(id).value = ""));
        applyDashboardFilters();
      }

      function rowsMatchingTopFilters(excludeId = "") {
        const year = $("filterYear").value;
        const month = $("filterMonth").value;
        const employee = $("filterEmployee").value;
        const department = $("filterDepartment").value;
        const category = $("filterCategory").value;
        const currency = $("filterCurrency").value;
        return (app.receipts || []).filter((r) =>
          (excludeId === "filterYear" || !year || String(r["연도"]) === year) &&
          (excludeId === "filterMonth" || !month || String(r["월"]) === month) &&
          (excludeId === "filterEmployee" || !employee || r["이름"] === employee) &&
          (excludeId === "filterDepartment" || !department || r["소속"] === department) &&
          (excludeId === "filterCategory" || !category || r["비용대분류"] === category) &&
          (excludeId === "filterCurrency" || !currency || currencyOf(r) === currency)
        );
      }

      function filteredReceipts() {
        return rowsMatchingTopFilters();
      }

      function refreshDashboardFilterOptions() {
        const selected = {
          filterYear: $("filterYear").value,
          filterMonth: $("filterMonth").value,
          filterEmployee: $("filterEmployee").value,
          filterDepartment: $("filterDepartment").value,
          filterCategory: $("filterCategory").value,
          filterCurrency: $("filterCurrency").value,
        };
        const configs = [
          ["filterYear", "연도", "전체 연도", true],
          ["filterMonth", "월", "전체 월", false],
          ["filterEmployee", "이름", "전체 사용자", false],
          ["filterDepartment", "소속", "전체 소속", false],
          ["filterCategory", "비용대분류", "전체 분류", false],
        ];
        configs.forEach(([id, key, label, reverse]) => {
          const values = uniqueValues(rowsMatchingTopFilters(id), key);
          if (reverse) values.reverse();
          fillFilter(id, values, label, selected[id]);
        });
        const currencies = [...new Set(rowsMatchingTopFilters("filterCurrency").map(currencyOf))]
          .sort((a, b) => a.localeCompare(b));
        fillFilter("filterCurrency", currencies, "전체 통화", selected.filterCurrency);
      }

      function groupAmounts(rows, key) {
        return Object.entries(rows.reduce((group, row) => {
          const name = String(row[key] || "미분류");
          group[name] = (group[name] || 0) + Number(row["결제금액"] || 0);
          return group;
        }, {})).sort((a, b) => b[1] - a[1]);
      }

      function breakdownLabel(key, value) {
        if (key === "연도") return value + "년";
        if (key === "월") return value + "월";
        return value;
      }

      function renderBreakdown(rows) {
        const currencies = [...new Set(rows.map(currencyOf))];
        if (currencies.length > 1) {
          $("breakdownChart").innerHTML = '<div class="empty">통화별 정확한 비교를 위해 위에서 통화를 하나 선택하세요.</div>';
          return;
        }
        const code = currencies[0] || "KRW";
        let entries = groupAmounts(rows, breakdownKey);
        if (breakdownKey === "연도" || breakdownKey === "월") {
          entries.sort((a, b) => Number(a[0]) - Number(b[0]));
        }
        if (!entries.length) {
          $("breakdownChart").innerHTML = '<div class="empty">조건에 해당하는 데이터가 없습니다.</div>';
          return;
        }
        const max = Math.max(...entries.map((x) => Number(x[1]) || 0), 1);
        $("breakdownChart").innerHTML = entries.map(([value, amount]) => {
          const count = rows.filter((r) => String(r[breakdownKey] || "미분류") === String(value)).length;
          return '<div class="bar-row clickable" data-value="' + escapeHtml(value) + '"><span>' +
            escapeHtml(breakdownLabel(breakdownKey, value)) + ' <small>(' + count + '건)</small></span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' +
            Math.max(2, Math.round(Number(amount) / max * 100)) + '%"></div></div><b>' + money(amount, code) + "</b></div>";
        }).join("");
        $("breakdownChart").querySelectorAll(".clickable").forEach((row) => {
          row.addEventListener("click", () => showBreakdownDetail(row.dataset.value));
        });
      }

      function showBreakdownDetail(value) {
        $("filterEmployee").value = value;
        applyDashboardFilters();
      }

      function receiptDateTime(r) {
        return String(r["구매일자"] || "") + " " + String(r["구매시간"] || "");
      }

      function sortReceiptsNewest(rows) {
        return [...rows].sort((a, b) => receiptDateTime(b).localeCompare(receiptDateTime(a)));
      }

      function renderDashboardReceiptTable(rows, title = "결과 Data") {
        const sorted = sortReceiptsNewest(rows);
        $("dashboardReceiptTitle").textContent = title;
        $("rankingRows").innerHTML = sorted.length
          ? sorted.map((r) =>
              "<tr><td>" + escapeHtml(r["구매일자"]) + " " + escapeHtml(r["구매시간"]) +
              "</td><td>" + escapeHtml(r["이름"]) + "<br>" + escapeHtml(r["사번"]) +
              "</td><td>" + escapeHtml(r["구매처"]) + "</td><td>" + escapeHtml(r["비용대분류"]) +
              "</td><td>" + escapeHtml(r["승인번호"]) + "</td><td><b>" +
              money(r["결제금액"], currencyOf(r)) + "</b></td><td>" +
              receiptActionButtons(r) + "</td></tr>"
            ).join("")
          : '<tr><td colspan="7" class="empty">조건에 해당하는 데이터가 없습니다.</td></tr>';
      }

      function receiptActionButtons(r) {
        const id = escapeHtml(r["영수증ID"]);
        return '<div class="row-actions"><button type="button" class="table-action" onclick="editReceipt(\'' +
          id + '\')">수정</button><button type="button" class="danger" onclick="deleteReceiptById(\'' +
          id + '\')">삭제</button></div>';
      }

      function receiptById(receiptId) {
        return (app.receipts || []).find((r) => String(r["영수증ID"]) === String(receiptId));
      }

      function editReceipt(receiptId) {
        const r = receiptById(receiptId);
        if (!r) {
          alert("영수증 정보를 찾을 수 없습니다. 화면을 새로고침해 주세요.");
          return;
        }
        $("editingReceiptId").value = r["영수증ID"] || "";
        $("editingReceiptVersion").value = r._version || "";
        $("purchaseDate").value = r["구매일자"] || "";
        $("purchaseTime").value = r["구매시간"] || "";
        $("buyerName").value = r["이름"] || "";
        syncEmp();
        $("merchant").value = r["구매처"] || "";
        $("category").value = r["비용대분류"] || "";
        $("subcategory").value = r["세부분류"] || "";
        $("approvalNumber").value = r["승인번호"] || "";
        $("currencyCode").value = currencyOf(r);
        $("amount").value = r["결제금액"] || "";
        $("saveButton").textContent = "수정 내용 저장";
        $("editActions").hidden = false;
        $("photo").innerHTML = '<h2>✎</h2><b>영수증 수정 중</b><p>필요한 항목을 고친 뒤 저장하세요.</p>';
        show("scan", $("tabScan"));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function cancelEdit() {
        $("editingReceiptId").value = "";
        $("editingReceiptVersion").value = "";
        document.querySelector("#scan form").reset();
        $("buyerName").value = "";
        $("employeeId").value = "";
        $("currencyCode").value = "KRW";
        $("saveButton").textContent = "확인 후 저장";
        $("editActions").hidden = true;
        $("photo").innerHTML = '<h2>⌁</h2><b>영수증 촬영</b><p>눌러서 카메라를 실행하세요.</p>';
        image = "";
      }

      async function deleteReceiptById(receiptId) {
        const r = receiptById(receiptId);
        if (!r) {
          alert("영수증 정보를 찾을 수 없습니다. 화면을 새로고침해 주세요.");
          return;
        }
        const description = (r["구매일자"] || "") + " / " + (r["구매처"] || "") +
          " / " + money(r["결제금액"], currencyOf(r));
        if (!confirm(description + "\n\n이 영수증을 삭제하시겠습니까? 삭제 후 복구할 수 없습니다.")) return;
        try {
          await postJob("delete", {
            payload: JSON.stringify({ receiptId: r["영수증ID"], version: r._version }),
          });
          alert("삭제했습니다.");
          location.reload();
        } catch (err) {
          alert(err.message);
        }
      }

      function deleteEditingReceipt() {
        const receiptId = $("editingReceiptId").value;
        if (receiptId) deleteReceiptById(receiptId);
      }

      function drawBars(id, entries, colorClass = "", limit = 12) {
        const target = $(id);
        const list = entries.slice(0, limit);
        if (!list.length) {
          target.innerHTML = '<div class="empty">조건에 해당하는 데이터가 없습니다.</div>';
          return;
        }
        const max = Math.max(...list.map((x) => Number(x[1]) || 0), 1);
        target.innerHTML = list.map(([label, amount]) =>
          '<div class="bar-row"><span title="' + escapeHtml(label) + '">' + escapeHtml(label) +
          '</span><div class="bar-track"><div class="bar-fill ' + colorClass + '" style="width:' +
          Math.max(2, Math.round(Number(amount) / max * 100)) + '%"></div></div><b>' + won(amount) + "</b></div>"
        ).join("");
      }

      function applyDashboardFilters() {
        refreshDashboardFilterOptions();
        const rows = filteredReceipts();
        const totals = rows.reduce((o, r) => {
          const code = currencyOf(r);
          o[code] = (o[code] || 0) + Number(r["결제금액"] || 0);
          return o;
        }, {});
        $("total").innerHTML = Object.entries(totals).length
          ? Object.entries(totals).map(([code, value]) => money(value, code)).join("<br>")
          : "0 KRW";
        $("count").textContent = rows.length + "건";
        renderBreakdown(rows);
        renderDashboardReceiptTable(rows, "결과 Data");
      }

      function render(d) {
        applyDashboardFilters();
        $("rows").innerHTML = sortReceiptsNewest(d.receipts)
          .map(
            (r) =>
              "<tr><td>" +
              r["구매일자"] +
              " " +
              r["구매시간"] +
              "</td><td>" +
              r["이름"] +
              "<br>" +
              r["사번"] +
              "</td><td>" +
              r["구매처"] +
              "</td><td>" +
              r["비용대분류"] +
              "</td><td>" +
              r["승인번호"] +
              "</td><td>" +
              money(r["결제금액"], currencyOf(r)) +
              "</td><td>" +
              receiptActionButtons(r) +
              "</td></tr>",
          )
          .join("");
      }
      async function compressImage(file) {
        const source = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const img = await new Promise((resolve, reject) => {
          const element = new Image();
          element.onload = () => resolve(element);
          element.onerror = reject;
          element.src = source;
        });
        const maxSize = 2800;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas
          .getContext("2d")
          .drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.95);
      }

      async function createCriticalImage(source, regions) {
        const img = await new Promise((resolve, reject) => {
          const element = new Image();
          element.onload = () => resolve(element);
          element.onerror = reject;
          element.src = source;
        });
        const selected = Array.isArray(regions) && regions.length
          ? regions.slice(0, 4)
          : [{ x: 0, y: 0.42, width: 1, height: 0.58 }];
        const outputWidth = 2200;
        const prepared = selected.map((r) => {
          const sx = Math.max(0, Math.round(Number(r.x || 0) * img.width));
          const sy = Math.max(0, Math.round(Number(r.y || 0) * img.height));
          const sw = Math.max(1, Math.min(img.width - sx, Math.round(Number(r.width || 1) * img.width)));
          const sh = Math.max(1, Math.min(img.height - sy, Math.round(Number(r.height || 1) * img.height)));
          const scale = outputWidth / sw;
          return { sx, sy, sw, sh, height: Math.max(160, Math.round(sh * scale)) };
        });
        const gap = 24;
        const canvas = document.createElement("canvas");
        canvas.width = outputWidth;
        canvas.height = prepared.reduce((sum, r) => sum + r.height * 2 + gap * 2, 0);
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        let y = 0;
        prepared.forEach((r) => {
          ctx.drawImage(img, r.sx, r.sy, r.sw, r.sh, 0, y, outputWidth, r.height);
          y += r.height + gap;
          ctx.drawImage(img, r.sx, r.sy, r.sw, r.sh, 0, y, outputWidth, r.height);
          const pixels = ctx.getImageData(0, y, outputWidth, r.height);
          for (let i = 0; i < pixels.data.length; i += 4) {
            const gray = pixels.data[i] * 0.299 + pixels.data[i + 1] * 0.587 + pixels.data[i + 2] * 0.114;
            const contrasted = Math.max(0, Math.min(255, (gray - 128) * 1.55 + 128));
            pixels.data[i] = contrasted;
            pixels.data[i + 1] = contrasted;
            pixels.data[i + 2] = contrasted;
          }
          ctx.putImageData(pixels, 0, y);
          y += r.height + gap;
        });
        return canvas.toDataURL("image/jpeg", 0.96);
      }

      file.onchange = async (e) => {
        const selectedFile = e.target.files[0];
        if (!selectedFile) return;
        try {
          image = await compressImage(selectedFile);
          photo.innerHTML = '<img src="' + image + '"><p>Vision OCR 분석 중…</p>';
          const vision = await postJob("vision", { image });
          photo.querySelector("p").textContent = "숫자 영역 확대 중…";
          const criticalImage = await createCriticalImage(image, vision.regions);
          photo.querySelector("p").textContent = "AI 정밀 분석 중…";
          const x = await postJob("analyze", {
            image,
            criticalImage,
            ocrText: vision.text || "",
          });
          Object.entries(x).forEach(([k, v]) => {
            if ($(k) && v !== undefined) $(k).value = v;
          });
          syncEmp();
          photo.querySelector("p").textContent = "분석 완료";
          if (Array.isArray(x.warnings) && x.warnings.length) {
            alert("확인 필요\n\n" + x.warnings.join("\n"));
          }
        } catch (err) {
          photo.querySelector("p").textContent = "분석 실패";
          alert(err.message);
        }
      };

      async function save(e) {
        e.preventDefault();
        const x = {};
        [
          "purchaseDate",
          "purchaseTime",
          "buyerName",
          "employeeId",
          "merchant",
          "category",
          "subcategory",
          "approvalNumber",
          "currencyCode",
          "amount",
        ].forEach((k) => (x[k] = $(k).value));
        const editingId = $("editingReceiptId").value;
        if (editingId) {
          x.receiptId = editingId;
          x.version = $("editingReceiptVersion").value;
        }

        try {
          await postJob(editingId ? "update" : "save", {
            payload: JSON.stringify(x),
          });
          alert(editingId ? "수정 내용을 저장했습니다." : "저장했습니다.");
          location.reload();
        } catch (err) {
          alert(err.message);
        }
      }

      init();
    </script>
  </body>
