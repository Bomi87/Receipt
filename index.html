<!doctype html>
<!-- RECEIPT FRONTEND — DUPLICATE PRECHECK V9 — 2026-08-20 -->
<html lang="ko">
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>영수증 비용관리</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        font-family: Arial;
        margin: 0;
        background: #f4f7fa;
        color: #18293b;
        overflow-x: hidden;
      }
      button {
        transition: background-color 0.14s ease, color 0.14s ease,
          border-color 0.14s ease, transform 0.08s ease, filter 0.14s ease;
        -webkit-tap-highlight-color: rgba(38, 118, 237, 0.2);
        touch-action: manipulation;
      }
      button:active {
        transform: scale(0.96);
        filter: brightness(0.82);
      }
      button:focus-visible {
        outline: 3px solid rgba(38, 118, 237, 0.28);
        outline-offset: 2px;
      }
      header {
        background: #14263c;
        color: #fff;
        padding: 18px;
      }
      main {
        width: 100%;
        max-width: 1050px;
        margin: auto;
        padding: 18px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
      }
      .refresh-button {
        margin-left: auto;
        border: 1px solid #c8d5e3 !important;
        background: #fff;
        color: #36506b;
        cursor: pointer;
        white-space: nowrap;
      }
      .refresh-button:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .tabs button,
      .primary {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .primary,
      .tabs .on {
        background: #2676ed;
        color: #fff;
      }
      .panel {
        min-width: 0;
        background: #fff;
        border: 1px solid #e1e7ed;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .cards b {
        display: block;
        font-size: 22px;
        margin-top: 9px;
        white-space: nowrap;
      }
      .total-title-approx {
        display: inline-block;
        white-space: nowrap;
        color: #000;
        font-size: 0.875em;
        font-style: italic;
        font-weight: 400;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(8, minmax(100px, 1fr));
        gap: 10px;
        align-items: end;
      }
      .filters label {
        font-size: 12px;
        color: #607286;
      }
      .filters select,
      .filters button {
        width: 100%;
        height: 40px;
        margin-top: 5px;
        border: 1px solid #d7e0e8;
        border-radius: 8px;
        background: #fff;
        padding: 0 9px;
        font-size: 16px;
      }
      .filters button:active {
        border-color: #2676ed;
        background: #2676ed;
        color: #fff;
      }
      .filters .reset-filter-button {
        border-color: #7456d8;
        background: #7456d8;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .filters .reset-filter-button:active {
        border-color: #5638b9;
        background: #5638b9;
        color: #fff;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .chart-title {
        margin: 0 0 16px;
      }
      .breakdown-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .breakdown-head .chart-title {
        margin: 0;
      }
      .breakdown-select {
        min-width: 150px;
        height: 40px;
        border: 1px solid #d7e0e8;
        border-radius: 8px;
        background: #fff;
        padding: 0 10px;
        font-size: 16px;
        color: #18293b;
      }
      .result-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .result-head .chart-title {
        margin: 0;
      }
      .export-button {
        border: 0;
        border-radius: 8px;
        background: #14804a;
        color: #fff;
        padding: 10px 14px;
        font-weight: 700;
        white-space: nowrap;
        cursor: pointer;
      }
      .bar-row {
        display: grid;
        grid-template-columns: minmax(80px, 130px) 1fr auto;
        gap: 10px;
        align-items: center;
        margin: 11px 0;
        font-size: 13px;
      }
      .bar-amount {
        color: #000;
        text-align: right;
        white-space: nowrap;
      }
      .bar-amount .approximate-krw {
        display: block;
        margin-top: 2px;
        color: #000;
        font-size: 12px;
        font-style: italic;
        font-weight: 400;
      }
      .bar-track {
        height: 16px;
        background: #edf2f7;
        border-radius: 8px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        min-width: 3px;
        border-radius: 8px;
        background: linear-gradient(90deg, #2676ed, #61a0ff);
      }
      .bar-fill.green {
        background: linear-gradient(90deg, #12a06a, #58c99d);
      }
      .bar-fill.orange {
        background: linear-gradient(90deg, #ef8a27, #ffc15c);
      }
      .empty {
        padding: 28px 0;
        text-align: center;
        color: #8291a1;
      }
      .rank-table td:last-child,
      .rank-table th:last-child {
        text-align: center;
        white-space: nowrap;
      }
      .breakdown-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }
      .breakdown-tabs button {
        border: 1px solid #d7e0e8;
        border-radius: 20px;
        background: #fff;
        padding: 9px 15px;
        color: #36506b;
      }
      .breakdown-tabs button.on {
        border-color: #2676ed;
        background: #2676ed;
        color: #fff;
      }
      .criteria-picker {
        border: 1px solid #d7e0e8;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 16px;
        background: #f8fafc;
      }
      .criteria-picker-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .criteria-picker-head button {
        border: 0;
        border-radius: 7px;
        padding: 7px 10px;
      }
      .criteria-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 7px;
      }
      .criteria-actions .clear-all {
        background: #2676ed;
        color: #fff;
      }
      .criteria-options {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-height: 160px;
        overflow: auto;
      }
      .criteria-options label {
        display: flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d7e0e8;
        border-radius: 18px;
        background: #fff;
        padding: 7px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      .criteria-summary {
        margin: 0 0 14px;
        color: #52677d;
        font-size: 13px;
      }
      .clickable {
        cursor: pointer;
        padding: 5px;
        border-radius: 7px;
      }
      .clickable:hover {
        background: #f4f7fa;
      }
      .detail-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .detail-head button {
        border: 0;
        border-radius: 7px;
        padding: 8px 11px;
      }
      .scan {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }
      .drop {
        min-height: 420px;
        border: 2px dashed #becbd7;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .drop img {
        max-width: 100%;
        max-height: 390px;
      }
      .form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 14px;
        align-content: start;
      }
      .form label {
        display: block;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        color: #52677d;
        font-size: 13px;
        font-weight: 600;
      }
      .form input,
      .form select {
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        height: 48px;
        margin-top: 7px;
        border: 1px solid #d7e0e8;
        border-radius: 9px;
        background: #fff;
        color: #18293b;
        padding: 0 12px;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.2;
      }
      .form textarea {
        display: block;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        min-height: 88px;
        margin-top: 7px;
        border: 1px solid #d7e0e8;
        border-radius: 9px;
        background: #fff;
        color: #18293b;
        padding: 12px;
        font-family: inherit;
        font-size: 16px;
        line-height: 1.5;
        resize: vertical;
      }
      .form input[type="date"],
      .form input[type="time"] {
        min-width: 0;
        width: 100%;
        max-width: 100%;
        -webkit-appearance: none;
        appearance: none;
      }
      .form input[type="date"]::-webkit-date-and-time-value,
      .form input[type="time"]::-webkit-date-and-time-value {
        min-width: 0;
        text-align: left;
      }
      .date-time-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 14px;
        min-width: 0;
        max-width: 100%;
      }
      .form input:focus,
      .form select:focus,
      .form textarea:focus {
        border-color: #2676ed;
        outline: 3px solid rgba(38, 118, 237, 0.12);
      }
      .form input[type="hidden"] {
        display: none;
      }
      .form .primary {
        width: 100%;
        min-height: 48px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .secondary,
      .danger,
      .table-action {
        border: 0;
        border-radius: 8px;
        padding: 9px 11px;
        cursor: pointer;
      }
      .secondary,
      .table-action {
        background: #edf2f7;
        color: #29435f;
      }
      .danger {
        background: #e5484d;
        color: #fff;
      }
      .row-actions {
        display: flex;
        gap: 6px;
        white-space: nowrap;
      }
      .row-actions .danger,
      .row-actions .table-action {
        padding: 6px 9px;
        font-size: 12px;
      }
      .wide {
        grid-column: 1/-1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #edf0f3;
        text-align: left;
      }
      @media (max-width: 700px) {
        .cards {
          grid-template-columns: minmax(0, 2fr) minmax(110px, 0.85fr);
          gap: 10px;
        }
        .cards .panel {
          padding: 14px;
        }
        .cards .total-card b {
          font-size: 20px;
          line-height: 1.35;
        }
        .cards .count-card {
          padding-left: 12px;
          padding-right: 12px;
          font-size: 13px;
          white-space: nowrap;
        }
        .cards .count-card b {
          font-size: 22px;
        }
        .total-title-approx {
          display: block;
          margin-top: 2px;
          font-size: 0.82em;
        }
        .scan {
          grid-template-columns: 1fr;
        }
        .form {
          width: 100%;
          max-width: 100%;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          column-gap: 18px;
          row-gap: 15px;
        }
        .form .wide {
          grid-column: 1 / -1;
        }
        .form textarea {
          min-height: 76px;
          padding: 11px 12px;
          font-size: 16px;
          line-height: 1.45;
        }
        .date-time-row {
          grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
          column-gap: 18px;
        }
        .drop {
          min-height: 300px;
        }
        .filters {
          grid-template-columns: 1fr 1fr;
        }
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
        .bar-row {
          grid-template-columns: 80px 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="authScreen" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef2f6;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;font-weight:700;">
      승인 확인 중...
    </div>
    <div id="appRoot" style="display:none;">
    <header><b>Receipt Flow</b>　영수증 비용관리</header>
    <main>
      <div class="tabs">
        <button id="tabDash" onclick="show('dash', this)" class="on">대시보드</button
        ><button id="tabScan" onclick="openNewScan(this)">영수증 스캔</button>
        <button id="refreshButton" type="button" class="refresh-button" onclick="refreshDashboardData()">↻ 새로고침</button>
      </div>
      <section id="dash" hidden>
        <div class="panel filters">
          <label>연도<select id="filterYear" onchange="applyDashboardFilters()"></select></label>
          <label>월<select id="filterMonth" onchange="applyDashboardFilters()"></select></label>
          <label>사용자<select id="filterEmployee" onchange="applyDashboardFilters()"></select></label>
          <label>소속<select id="filterDepartment" onchange="applyDashboardFilters()"></select></label>
          <label>비용분류<select id="filterCategory" onchange="applyDashboardFilters()"></select></label>
          <label>통화<select id="filterCurrency" onchange="applyDashboardFilters()"></select></label>
          <label>제출자<select id="filterSubmitter" onchange="applyDashboardFilters()"></select></label>
          <button type="button" class="reset-filter-button" onclick="resetDashboardFilters()">필터 초기화</button>
        </div>
        <div class="cards">
          <article class="panel total-card"><span id="totalTitle">총 결제금액</span><b id="total">0원</b></article>
          <article class="panel count-card">등록 영수증<b id="count">0건</b></article>
        </div>
        <div class="panel">
          <div class="breakdown-head">
            <h3 class="chart-title">지출 현황</h3>
            <select id="breakdownSelect" class="breakdown-select" onchange="changeBreakdownKey()">
              <option value="이름">사용자별</option>
              <option value="소속">소속별</option>
              <option value="비용대분류">비용분류별</option>
              <option value="통화">통화별</option>
              <option value="연도">연도별</option>
              <option value="월">월별</option>
            </select>
          </div>
          <div id="breakdownChart"></div>
        </div>
        <div id="dashboardReceiptPanel" class="panel" style="overflow:auto">
          <div class="result-head">
            <h3 id="dashboardReceiptTitle" class="chart-title">결과 Data</h3>
            <button type="button" class="export-button" onclick="exportFilteredData()">Excel 추출</button>
          </div>
          <table class="rank-table">
            <thead><tr><th>구매일시</th><th>사용자</th><th>구매처</th><th>분류</th><th>승인번호</th><th>금액</th><th>제출자</th><th>관리</th></tr></thead>
            <tbody id="rankingRows"></tbody>
          </table>
        </div>
      </section>
      <section id="scan" hidden>
        <div class="scan">
          <div class="panel drop" onclick="file.click()">
            <div id="photo">
              <h2>⌁</h2>
              <b>영수증 촬영</b>
              <p>눌러서 카메라를 실행하세요.</p>
            </div>
            <input
              id="file"
              hidden
              type="file"
              accept="image/*"
              capture="environment"
            />
          </div>
          <form class="panel form" onsubmit="save(event)">
            <div class="date-time-row wide">
              <label>
                구매일자
                <input id="purchaseDate" type="date" required />
              </label>
              <label>
                구매시간
                <input id="purchaseTime" type="time" />
              </label>
            </div>
            <label class="wide">
              구매자
              <select id="buyerName" onchange="syncEmp()"></select>
            </label>
            <input id="employeeId" type="hidden" />
            <input id="editingReceiptId" type="hidden" />
            <input id="editingReceiptVersion" type="hidden" />
            <label class="wide">
              구매처
              <input id="merchant" required />
            </label>
            <label>
              비용 분류
              <select id="category"></select>
            </label>
            <label>
              세부 분류
              <input id="subcategory" />
            </label>
            <label class="wide">
              승인번호
              <input id="approvalNumber" />
            </label>
            <label>
              통화
              <input id="currencyCode" maxlength="3" value="KRW" required />
            </label>
            <label>
              결제금액
              <input id="amount" type="number" step="0.01" min="0" required />
            </label>
            <label class="wide">
              메모
              <textarea
                id="memo"
                rows="3"
                placeholder="필요한 내용을 입력하세요."
              ></textarea>
            </label>
            <button id="saveButton" class="primary wide">확인 후 저장</button>
          </form>
        </div>
      </section>
    </main>
    </div>
    <script>
      // Apps Script에서 웹 앱으로 배포한 /exec 주소를 입력하세요.
      const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw1Faxi5ZdRbLfbcdybAJLe-X7qFbR5iYoCOLhvtK0gI-2tjGEO9sAc3CEfXf_xv0J7/exec";
      const REQUIRED_BACKEND_BUILD = "2026-08-21-OCR-STATUS-FIX-V1";

   
      let app = {};
      let image = "";
      let currentPortalUser = null;
      let receiptAppStarted = false;
      const ACTIVE_TAB_KEY = "receiptFlow.activeTab";

      const $ = (id) => document.getElementById(id);
      const won = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";
      const currencyOf = (r) => String(r["통화"] || "KRW").toUpperCase();
      const money = (n, code) => Number(n || 0).toLocaleString("ko-KR", {
        maximumFractionDigits: ["KRW", "JPY", "VND"].includes(code) ? 0 : 2,
      }) + " " + code;
      const DEPARTMENTS = ["담당", "팀장", "기획", "객실", "정비", "운항관리", "조종", "헬기"];
      let breakdownKey = "이름";

      function show(id, b) {
        ["dash", "scan"].forEach((x) => ($(x).hidden = x !== id));
        document
          .querySelectorAll(".tabs button")
          .forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
        try {
          sessionStorage.setItem(ACTIVE_TAB_KEY, id);
        } catch (err) {}
      }

      function restoreActiveTab() {
        let id = "dash";
        try {
          id = sessionStorage.getItem(ACTIVE_TAB_KEY) || "dash";
        } catch (err) {}
        const buttonMap = { dash: "tabDash", scan: "tabScan" };
        if (!buttonMap[id]) id = "dash";
        show(id, $(buttonMap[id]));
      }

      function openNewScan(button) {
        resetEditForm();
        show("scan", button);
      }
      function checkBackendUrl() {
        if (!BACKEND_URL.startsWith("https://script.google.com/macros/s/")) {
          throw new Error(
            "프론트 코드 상단의 BACKEND_URL에 Apps Script /exec 주소를 입력하세요.",
          );
        }
      }

      function jsonpOnce(action, params = {}) {
        checkBackendUrl();
        return new Promise((resolve, reject) => {
          const callbackName =
            "receiptCallback_" +
            Date.now() +
            "_" +
            Math.random().toString(36).slice(2);
          const script = document.createElement("script");
          const timeout = setTimeout(() => {
            cleanup();
            const error = new Error("백엔드 응답 시간이 초과되었습니다.");
            error.isNetworkError = true;
            reject(error);
          }, 60000);

          function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
          }

          window[callbackName] = (response) => {
            cleanup();
            response.ok
              ? resolve(response)
              : reject(new Error(response.error || "요청에 실패했습니다."));
          };

          const query = new URLSearchParams({
            action,
            callback: callbackName,
            ...params,
          });
          script.onerror = () => {
            cleanup();
            const error = new Error("백엔드에 연결할 수 없습니다.");
            error.isNetworkError = true;
            reject(error);
          };
          script.src = BACKEND_URL + "?" + query.toString();
          document.head.appendChild(script);
        });
      }

      async function postJob(action, values) {
        checkBackendUrl();
        const requestId =
          Date.now().toString(36) + Math.random().toString(36).slice(2);
        const body = new URLSearchParams({
          action,
          requestId,
          ...values,
        });

        let dispatchError = null;
        fetch(BACKEND_URL, {
          method: "POST",
          mode: "no-cors",
          body,
        }).catch((error) => {
          dispatchError = error;
        });

        // 상태 확인은 1.5초 간격으로 수행하여 동시 실행과 호출량을 줄입니다.
        // 84회 × 1.5초 = 기존과 비슷한 최대 약 126초 대기입니다.
        let waitingCount = 0;
        for (let i = 0; i < 84; i += 1) {
          await new Promise((resolve) => setTimeout(resolve, 1500));

          if (dispatchError) {
            throw new Error(
              "분석 요청을 백엔드에 전송하지 못했습니다. 네트워크 상태를 확인한 뒤 다시 시도해 주세요.",
            );
          }

          const result = await jsonp("status", { requestId });

          if (result.state === "waiting") {
            waitingCount += 1;
            // 여러 사용자의 동시 요청으로 Apps Script 실행이 대기할 수 있으므로
            // 작업 미확인 상태를 최대 약 60초(40회 × 1.5초)까지 기다립니다.
            if (waitingCount >= 40) {
              throw new Error(
                "백엔드에서 분석 요청을 확인하지 못했습니다. Apps Script 최신 버전 배포와 접속 권한을 확인해 주세요.",
              );
            }
            continue;
          }

          waitingCount = 0;
          if (result.state === "done") return result.data;
          if (result.state === "error") {
            throw new Error(result.error || "처리 중 오류가 발생했습니다.");
          }
        }
        throw new Error("처리 시간이 초과되었습니다. 다시 시도해 주세요.");
      }

      async function init() {
        try {
          const response = await jsonp("initial");
          const d = response.data;
          if (d.backendBuild !== REQUIRED_BACKEND_BUILD) {
            throw new Error("프론트와 백엔드 버전이 다릅니다. Apps Script를 새 버전으로 다시 배포해 주세요.");
          }
          app = d;
          $("buyerName").innerHTML = '<option value="">구매자를 선택하세요</option>' + d.employees
            .map(
              (e) =>
                '<option value="' +
                e.name +
                '">' +
                e.name +
                " / " +
                e.employeeId +
                " / " +
                e.department +
                "</option>",
            )
            .join("");
          $("category").innerHTML = d.categories
            .map((x) => "<option>" + x + "</option>")
            .join("");
          setupDashboardFilters();
          $("buyerName").value = "";
          $("employeeId").value = "";
          render(d);
          loadExchangeRates();
        } catch (err) {
          alert(err.message);
        }
      }

      function syncEmp() {
        let e = app.employees?.find((x) => x.name == $("buyerName").value);
        $("employeeId").value = e ? e.employeeId : "";
      }

      function collectReceiptPayload() {
        syncEmp();
        const x = {};
        [
          "purchaseDate", "purchaseTime", "buyerName", "employeeId",
          "merchant", "category", "subcategory", "approvalNumber",
          "currencyCode", "amount", "memo",
        ].forEach((k) => (x[k] = $(k).value));
        x.submitterName = String((currentPortalUser && currentPortalUser.name) || "").trim();
        x.submitterEmail = String((currentPortalUser && currentPortalUser.email) || "").trim();
        const editingId = $("editingReceiptId").value;
        if (editingId) {
          x.receiptId = editingId;
          x.version = $("editingReceiptVersion").value;
        }
        return x;
      }

      const escapeHtml = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      function uniqueValues(rows, key) {
        return [...new Set(rows.map((r) => String(r[key] || "")).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
      }

      function fillFilter(id, values, allLabel, selectedValue = "") {
        $(id).innerHTML =
          '<option value="">' + allLabel + "</option>" +
          values.map((v) => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>").join("");
        $(id).value = values.includes(selectedValue) ? selectedValue : "";
      }

      function setupDashboardFilters() {
        refreshDashboardFilterOptions();
      }

      function resetDashboardFilters() {
        ["filterYear", "filterMonth", "filterEmployee", "filterDepartment", "filterCategory", "filterCurrency", "filterSubmitter"]
          .forEach((id) => ($(id).value = ""));
        applyDashboardFilters();
      }

      function rowsMatchingTopFilters(excludeId = "") {
        const year = $("filterYear").value;
        const month = $("filterMonth").value;
        const employee = $("filterEmployee").value;
        const department = $("filterDepartment").value;
        const category = $("filterCategory").value;
        const currency = $("filterCurrency").value;
        const submitter = $("filterSubmitter").value;
        return (app.receipts || []).filter((r) =>
          (excludeId === "filterYear" || !year || String(r["연도"]) === year) &&
          (excludeId === "filterMonth" || !month || String(r["월"]) === month) &&
          (excludeId === "filterEmployee" || !employee || r["이름"] === employee) &&
          (excludeId === "filterDepartment" || !department || r["소속"] === department) &&
          (excludeId === "filterCategory" || !category || r["비용대분류"] === category) &&
          (excludeId === "filterCurrency" || !currency || currencyOf(r) === currency) &&
          (excludeId === "filterSubmitter" || !submitter || String(r["제출자"] || "") === submitter)
        );
      }

      function filteredReceipts() {
        return rowsMatchingTopFilters();
      }

      function refreshDashboardFilterOptions() {
        const selected = {
          filterYear: $("filterYear").value,
          filterMonth: $("filterMonth").value,
          filterEmployee: $("filterEmployee").value,
          filterDepartment: $("filterDepartment").value,
          filterCategory: $("filterCategory").value,
          filterCurrency: $("filterCurrency").value,
          filterSubmitter: $("filterSubmitter").value,
        };
        const configs = [
          ["filterYear", "연도", "-", true],
          ["filterMonth", "월", "-", false],
          ["filterEmployee", "이름", "-", false],
          ["filterDepartment", "소속", "-", false],
          ["filterCategory", "비용대분류", "-", false],
          ["filterSubmitter", "제출자", "-", false],
        ];
        configs.forEach(([id, key, label, reverse]) => {
          const values = uniqueValues(rowsMatchingTopFilters(id), key);
          if (reverse) values.reverse();
          fillFilter(id, values, label, selected[id]);
        });
        const currencies = [...new Set(rowsMatchingTopFilters("filterCurrency").map(currencyOf))]
          .sort((a, b) => a.localeCompare(b));
        fillFilter("filterCurrency", currencies, "-", selected.filterCurrency);
      }

      function groupAmounts(rows, key) {
        return Object.entries(rows.reduce((group, row) => {
          const name = String(row[key] || "미분류");
          const converted = currentKrwAmount(row);
          if (converted !== null) group[name] = (group[name] || 0) + converted;
          return group;
        }, {})).sort((a, b) => b[1] - a[1]);
      }

      function originalAmountLabel(rows) {
        const totals = rows.reduce((group, row) => {
          const code = currencyOf(row);
          group[code] = (group[code] || 0) + Number(row["결제금액"] || 0);
          return group;
        }, {});
        return Object.entries(totals)
          .map(([code, amount]) => money(amount, code))
          .join(" + ");
      }

      function approximateKrwLabel(rows) {
        const currencyCount = new Set(rows.map(currencyOf)).size;
        const convertedAmounts = rows.map(currentKrwAmount);
        if (
          currencyCount <= 1 ||
          !convertedAmounts.length ||
          convertedAmounts.some((value) => value === null)
        ) return "";
        const total = convertedAmounts.reduce((sum, value) => sum + value, 0);
        return "(약 " + roundKrwToHundreds(total).toLocaleString("ko-KR") + "원)";
      }

      function roundKrwToHundreds(value) {
        return Math.round(Number(value || 0) / 100) * 100;
      }

      async function loadExchangeRates() {
        const currencies = [...new Set((app.receipts || []).map(currencyOf))]
          .filter((code) => code !== "KRW");
        if (!currencies.length) return;
        try {
          const response = await jsonp("rates", { currencies: currencies.join(",") });
          app.exchangeRates = { ...(app.exchangeRates || {}), ...(response.data || {}) };
          applyDashboardFilters();
        } catch (err) {
          console.warn("환율 갱신 실패:", err.message);
        }
      }

      async function refreshDashboardData() {
        const button = $("refreshButton");
        const originalText = button.textContent;
        button.disabled = true;
        button.textContent = "갱신 중…";
        try {
          const response = await jsonp("initial");
          const d = response.data;
          if (d.backendBuild !== REQUIRED_BACKEND_BUILD) {
            throw new Error("프론트와 백엔드 버전이 다릅니다. Apps Script를 새 버전으로 다시 배포해 주세요.");
          }
          app = {
            ...app,
            ...d,
            exchangeRates: app.exchangeRates || d.exchangeRates || {},
          };
          setupDashboardFilters();
          render(app);
          button.textContent = "✓ 갱신 완료";
          loadExchangeRates();
          setTimeout(() => {
            button.textContent = originalText;
          }, 1200);
        } catch (err) {
          button.textContent = originalText;
          alert(err.message);
        } finally {
          button.disabled = false;
        }
      }

      function currentKrwAmount(row) {
        const amount = Number(row["결제금액"] || 0);
        const code = currencyOf(row);
        if (code === "KRW") return amount;
        const rate = Number(app.exchangeRates?.[code]?.rate || 0);
        return rate > 0 ? amount * rate : null;
      }

      function breakdownLabel(key, value) {
        if (key === "연도") return value + "년";
        if (key === "월") return value + "월";
        return value;
      }

      function renderBreakdown(rows) {
        let entries = groupAmounts(rows, breakdownKey);
        if (breakdownKey === "연도" || breakdownKey === "월") {
          entries.sort((a, b) => Number(a[0]) - Number(b[0]));
        }
        if (!entries.length) {
          $("breakdownChart").innerHTML = '<div class="empty">조건에 해당하는 데이터가 없습니다.</div>';
          return;
        }
        const max = Math.max(...entries.map((x) => Number(x[1]) || 0), 1);
        $("breakdownChart").innerHTML = entries.map(([value, amount]) => {
          const matchingRows = rows.filter((r) => String(r[breakdownKey] || "미분류") === String(value));
          const count = matchingRows.length;
          const approximate = approximateKrwLabel(matchingRows);
          return '<div class="bar-row clickable" data-value="' + escapeHtml(value) + '"><span>' +
            escapeHtml(breakdownLabel(breakdownKey, value)) + ' <small>(' + count + '건)</small></span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' +
            Math.max(2, Math.round(Number(amount) / max * 100)) + '%"></div></div><b class="bar-amount">' +
            escapeHtml(originalAmountLabel(matchingRows)) +
            (approximate ? '<em class="approximate-krw">' + escapeHtml(approximate) + "</em>" : "") +
            "</b></div>";
        }).join("");
        $("breakdownChart").querySelectorAll(".clickable").forEach((row) => {
          row.addEventListener("click", () => showBreakdownDetail(row.dataset.value));
        });
      }

      function changeBreakdownKey() {
        breakdownKey = $("breakdownSelect").value || "이름";
        applyDashboardFilters();
      }

      async function jsonp(action, params = {}) {
        let lastError;
        for (let attempt = 1; attempt <= 3; attempt += 1) {
          try {
            return await jsonpOnce(action, params);
          } catch (err) {
            lastError = err;
            if (!err.isNetworkError || attempt === 3) throw err;
            await new Promise((resolve) => setTimeout(resolve, attempt * 700));
          }
        }
        throw lastError || new Error("백엔드에 연결할 수 없습니다.");
      }

      function showBreakdownDetail(value) {
        const filterByKey = {
          "이름": "filterEmployee",
          "소속": "filterDepartment",
          "비용대분류": "filterCategory",
          "통화": "filterCurrency",
          "연도": "filterYear",
          "월": "filterMonth",
        };
        const filterId = filterByKey[breakdownKey];
        if (filterId) $(filterId).value = value;
        applyDashboardFilters();
      }

      function receiptDateTime(r) {
        return String(r["구매일자"] || "") + " " + String(r["구매시간"] || "");
      }

      function sortReceiptsNewest(rows) {
        return [...rows].sort((a, b) => receiptDateTime(b).localeCompare(receiptDateTime(a)));
      }

      function renderDashboardReceiptTable(rows, title = "결과 Data") {
        const sorted = sortReceiptsNewest(rows);
        $("dashboardReceiptTitle").textContent = title;
        $("rankingRows").innerHTML = sorted.length
          ? sorted.map((r) =>
              "<tr><td>" + escapeHtml(r["구매일자"]) + " " + escapeHtml(r["구매시간"]) +
              "</td><td>" + escapeHtml(r["이름"]) + "<br>" + escapeHtml(r["사번"]) +
              "</td><td>" + escapeHtml(r["구매처"]) + "</td><td>" + escapeHtml(r["비용대분류"]) +
              "</td><td>" + escapeHtml(r["승인번호"]) + "</td><td><b>" +
              money(r["결제금액"], currencyOf(r)) + "</b></td><td>" +
              escapeHtml(r["제출자"] || "-") + "</td><td>" +
              receiptActionButtons(r) + "</td></tr>"
            ).join("")
          : '<tr><td colspan="8" class="empty">조건에 해당하는 데이터가 없습니다.</td></tr>';

      function receiptActionButtons(r) {
        const id = escapeHtml(r["영수증ID"]);
        return '<div class="row-actions"><button type="button" class="table-action" onclick="editReceipt(\'' +
          id + '\')">수정</button><button type="button" class="danger" onclick="deleteReceiptById(\'' +
          id + '\')">삭제</button></div>';

      async function deleteReceiptById(receiptId) {
        const r = receiptById(receiptId);
        if (!r) {
          alert("영수증 정보를 찾을 수 없습니다. 화면을 새로고침해 주세요.");
          return;
        }

      function drawBars(id, entries, colorClass = "", limit = 12) {
        const target = $(id);
        const list = entries.slice(0, limit);

          target.innerHTML = '<div class="empty">조건에 해당하는 데이터가 없습니다.</div>';

      function applyDashboardFilters() {
        refreshDashboardFilterOptions();
        const rows = filteredReceipts();
        const totals = rows.reduce((group, row) => {
          const code = currencyOf(row);
          group[code] = (group[code] || 0) + Number(row["결제금액"] || 0);
          return group;
        }, {});
        $("total").innerHTML = Object.entries(totals).length
          ? Object.entries(totals).map(([code, value]) => money(value, code)).join("<br>")
          : "0 KRW";
        const currencyCount = Object.keys(totals).length;
        const convertedAmounts = rows.map(currentKrwAmount);
        const canShowApproximateTotal =
          currencyCount > 1 &&
          convertedAmounts.length > 0 &&
          convertedAmounts.every((value) => value !== null);
        $("totalTitle").innerHTML = canShowApproximateTotal
          ? '총 결제금액 <em class="total-title-approx">(약 ' +
            roundKrwToHundreds(convertedAmounts.reduce((sum, value) => sum + value, 0)).toLocaleString("ko-KR") +
            "원)</em>"
          : "총 결제금액";
        $("count").textContent = rows.length + "건";
        renderBreakdown(rows);
        renderDashboardReceiptTable(rows, "결과 Data");
      }

      function csvCell(value) {
        let text = String(value ?? "").replace(/\r?\n/g, " ");
        if (/^[=+\-@]/.test(text)) text = "'" + text;
        return '"' + text.replace(/"/g, '""') + '"';
      }

      function exportFilteredData() {
        const rows = sortReceiptsNewest(filteredReceipts());
        if (!rows.length) {
          alert("추출할 데이터가 없습니다.");
          return;
        }
        const table = [
          ["구매일자", "구매시간", "사용자", "사번", "구매처", "분류", "세부", "승인번호", "금액", "화폐", "제출자"],
          ...rows.map((r) => [
            r["구매일자"],
            r["구매시간"],
            r["이름"],
            r["사번"],
            r["구매처"],
            r["비용대분류"],
            r["세부분류"],
            r["승인번호"],
            Number(r["결제금액"] || 0),
            currencyOf(r),
            r["제출자"] || "",
          ]),
        ];
        const csv = "\uFEFF" + table.map((row) => row.map(csvCell).join(",")).join("\r\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const now = new Date();
        const stamp = now.getFullYear() +
          String(now.getMonth() + 1).padStart(2, "0") +
          String(now.getDate()).padStart(2, "0") + "_" +
          String(now.getHours()).padStart(2, "0") +
          String(now.getMinutes()).padStart(2, "0");
        link.href = url;
        link.download = "영수증_조회결과_" + stamp + ".csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function render(d) {
        applyDashboardFilters();
      }
      async function compressImage(file) {
        const source = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const img = await new Promise((resolve, reject) => {
          const element = new Image();
          element.onload = () => resolve(element);
          element.onerror = reject;
          element.src = source;
        });
        const maxSize = 2800;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas
          .getContext("2d")
          .drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.95);
      }

      async function createCriticalImage(source, regions) {
        const img = await new Promise((resolve, reject) => {
          const element = new Image();
          element.onload = () => resolve(element);
          element.onerror = reject;
          element.src = source;
        });
        const selected = Array.isArray(regions) && regions.length
          ? regions.slice(0, 4)
          : [{ x: 0, y: 0.42, width: 1, height: 0.58 }];
        const outputWidth = 2200;
        const prepared = selected.map((r) => {
          const sx = Math.max(0, Math.round(Number(r.x || 0) * img.width));
          const sy = Math.max(0, Math.round(Number(r.y || 0) * img.height));
          const sw = Math.max(1, Math.min(img.width - sx, Math.round(Number(r.width || 1) * img.width)));
          const sh = Math.max(1, Math.min(img.height - sy, Math.round(Number(r.height || 1) * img.height)));
          const scale = outputWidth / sw;
          return { sx, sy, sw, sh, height: Math.max(160, Math.round(sh * scale)) };
        });
        const gap = 24;
        const canvas = document.createElement("canvas");
        canvas.width = outputWidth;
        canvas.height = prepared.reduce((sum, r) => sum + r.height * 2 + gap * 2, 0);
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = "high";
        let y = 0;
        prepared.forEach((r) => {
          ctx.drawImage(img, r.sx, r.sy, r.sw, r.sh, 0, y, outputWidth, r.height);
          y += r.height + gap;
          ctx.drawImage(img, r.sx, r.sy, r.sw, r.sh, 0, y, outputWidth, r.height);
          const pixels = ctx.getImageData(0, y, outputWidth, r.height);
          for (let i = 0; i < pixels.data.length; i += 4) {
            const gray = pixels.data[i] * 0.299 + pixels.data[i + 1] * 0.587 + pixels.data[i + 2] * 0.114;
            const contrasted = Math.max(0, Math.min(255, (gray - 128) * 1.55 + 128));
            pixels.data[i] = contrasted;
            pixels.data[i + 1] = contrasted;
            pixels.data[i + 2] = contrasted;
          }
          ctx.putImageData(pixels, 0, y);
          y += r.height + gap;
        });
        return canvas.toDataURL("image/jpeg", 0.96);
      }

      file.onchange = async (e) => {
        const selectedFile = e.target.files[0];
        if (!selectedFile) return;
        try {
          image = await compressImage(selectedFile);
          photo.innerHTML = '<img src="' + image + '"><p>Vision OCR 분석 중…</p>';
          const vision = await postJob("vision", { image });
          photo.querySelector("p").textContent = "숫자 영역 확대 중…";
          const criticalImage = await createCriticalImage(image, vision.regions);
          photo.querySelector("p").textContent = "AI 정밀 분석 중…";
          const x = await postJob("analyze", {
            image,
            criticalImage,
            ocrText: vision.text || "",
          });
          Object.entries(x).forEach(([k, v]) => {
            if ($(k) && v !== undefined) $(k).value = v;
          });
          syncEmp();
          photo.querySelector("p").textContent = "분석 완료";
          if (Array.isArray(x.warnings) && x.warnings.length) {
            alert("확인 필요\n\n" + x.warnings.join("\n"));
          }
        } catch (err) {
          photo.querySelector("p").textContent = "분석 실패";
          alert(err.message);
        }
      };

      async function save(e) {
        e.preventDefault();
        const x = collectReceiptPayload();
        const editingId = $("editingReceiptId").value;
        try {
          const result = await postJob(editingId ? "update" : "save", {
            payload: JSON.stringify(x),
          });
          alert(editingId ? "수정 내용을 저장했습니다." : "저장했습니다.");
          location.reload();
        } catch (err) {
          alert(err.message);
        }
      }

        if (!currentPortalUser || !currentPortalUser.email) return;
        receiptAppStarted = true;
        restoreActiveTab();
        init();
