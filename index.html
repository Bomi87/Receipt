<!doctype html>
<html lang="ko">
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>영수증 비용관리</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
        background: #f4f7fa;
        color: #18293b;
      }
      header {
        background: #14263c;
        color: #fff;
        padding: 18px;
      }
      main {
        max-width: 1050px;
        margin: auto;
        padding: 18px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 15px;
      }
      .tabs button,
      .primary {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
      }
      .primary,
      .tabs .on {
        background: #2676ed;
        color: #fff;
      }
      .panel {
        background: #fff;
        border: 1px solid #e1e7ed;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .cards b {
        display: block;
        font-size: 22px;
        margin-top: 9px;
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(6, minmax(120px, 1fr));
        gap: 10px;
        align-items: end;
      }
      .filters label {
        font-size: 12px;
        color: #607286;
      }
      .filters select,
      .filters button {
        width: 100%;
        height: 40px;
        margin-top: 5px;
        border: 1px solid #d7e0e8;
        border-radius: 8px;
        background: #fff;
        padding: 0 9px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .chart-title {
        margin: 0 0 16px;
      }
      .bar-row {
        display: grid;
        grid-template-columns: minmax(80px, 130px) 1fr auto;
        gap: 10px;
        align-items: center;
        margin: 11px 0;
        font-size: 13px;
      }
      .bar-track {
        height: 16px;
        background: #edf2f7;
        border-radius: 8px;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        min-width: 3px;
        border-radius: 8px;
        background: linear-gradient(90deg, #2676ed, #61a0ff);
      }
      .bar-fill.green {
        background: linear-gradient(90deg, #12a06a, #58c99d);
      }
      .bar-fill.orange {
        background: linear-gradient(90deg, #ef8a27, #ffc15c);
      }
      .empty {
        padding: 28px 0;
        text-align: center;
        color: #8291a1;
      }
      .rank-table td:last-child,
      .rank-table th:last-child {
        text-align: right;
      }
      .breakdown-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }
      .breakdown-tabs button {
        border: 1px solid #d7e0e8;
        border-radius: 20px;
        background: #fff;
        padding: 9px 15px;
        color: #36506b;
      }
      .breakdown-tabs button.on {
        border-color: #2676ed;
        background: #2676ed;
        color: #fff;
      }
      .clickable {
        cursor: pointer;
        padding: 5px;
        border-radius: 7px;
      }
      .clickable:hover {
        background: #f4f7fa;
      }
      .detail-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
      }
      .detail-head button {
        border: 0;
        border-radius: 7px;
        padding: 8px 11px;
      }
      .scan {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .drop {
        min-height: 420px;
        border: 2px dashed #becbd7;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .drop img {
        max-width: 100%;
        max-height: 390px;
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
      }
      .form label {
        font-size: 12px;
      }
      .form input,
      .form select {
        width: 100%;
        height: 39px;
        margin-top: 5px;
        border: 1px solid #d7e0e8;
        border-radius: 7px;
        padding: 7px;
      }
      .wide {
        grid-column: 1/-1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        padding: 10px;
        border-bottom: 1px solid #edf0f3;
        text-align: left;
      }
      @media (max-width: 700px) {
        .cards {
          grid-template-columns: 1fr 1fr;
        }
        .scan {
          grid-template-columns: 1fr;
        }
        .drop {
          min-height: 300px;
        }
        .filters {
          grid-template-columns: 1fr 1fr;
        }
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
        .bar-row {
          grid-template-columns: 80px 1fr auto;
        }
      }
    </style>
  </head>
  <body>
    <header><b>Receipt Flow</b>　영수증 비용관리</header>
    <main>
      <div class="tabs">
        <button onclick="show('dash', this)" class="on">대시보드</button
        ><button onclick="show('scan', this)">영수증 스캔</button
        ><button onclick="show('list', this)">영수증 내역</button>
      </div>
      <section id="dash">
        <div class="panel filters">
          <label>연도<select id="filterYear" onchange="applyDashboardFilters()"></select></label>
          <label>월<select id="filterMonth" onchange="applyDashboardFilters()"></select></label>
          <label>사용자<select id="filterEmployee" onchange="applyDashboardFilters()"></select></label>
          <label>소속<select id="filterDepartment" onchange="applyDashboardFilters()"></select></label>
          <label>비용분류<select id="filterCategory" onchange="applyDashboardFilters()"></select></label>
          <button type="button" onclick="resetDashboardFilters()">필터 초기화</button>
        </div>
        <div class="cards">
          <article class="panel">총 결제금액<b id="total">0원</b></article>
          <article class="panel">등록 영수증<b id="count">0건</b></article>
        </div>
        <div class="panel">
          <h3 class="chart-title">통계 조회 기준</h3>
          <div class="breakdown-tabs">
            <button type="button" class="on" onclick="setBreakdown('이름', this)">사용자별</button>
            <button type="button" onclick="setBreakdown('소속', this)">부서별</button>
            <button type="button" onclick="setBreakdown('비용대분류', this)">비용분류별</button>
            <button type="button" onclick="setBreakdown('연도', this)">연도별</button>
            <button type="button" onclick="setBreakdown('월', this)">월별</button>
          </div>
          <div id="breakdownChart"></div>
        </div>
        <div id="breakdownDetail" class="panel" hidden>
          <div class="detail-head">
            <h3 id="breakdownDetailTitle" class="chart-title"></h3>
            <button type="button" onclick="closeBreakdownDetail()">닫기</button>
          </div>
          <div style="overflow:auto">
            <table class="rank-table">
              <thead><tr><th>구매일시</th><th>사용자</th><th>소속</th><th>구매처</th><th>분류</th><th>승인번호</th><th>금액</th></tr></thead>
              <tbody id="breakdownDetailRows"></tbody>
            </table>
          </div>
        </div>
        <div class="panel" style="overflow:auto">
          <h3 class="chart-title">영수증 금액 순위</h3>
          <table class="rank-table">
            <thead><tr><th>순위</th><th>구매일자</th><th>사용자</th><th>소속</th><th>구매처</th><th>분류</th><th>금액</th></tr></thead>
            <tbody id="rankingRows"></tbody>
          </table>
        </div>
      </section>
      <section id="scan" hidden>
        <div class="scan">
          <div class="panel drop" onclick="file.click()">
            <div id="photo">
              <h2>⌁</h2>
              <b>영수증 촬영</b>
              <p>눌러서 카메라를 실행하세요.</p>
            </div>
            <input
              id="file"
              hidden
              type="file"
              accept="image/*"
              capture="environment"
            />
          </div>
          <form class="panel form" onsubmit="save(event)">
            <label
              >구매일자<input id="purchaseDate" type="date" required /></label
            ><label>구매시간<input id="purchaseTime" type="time" /></label
            ><label
              >구매자<select
                id="buyerName"
                onchange="syncEmp()"
              ></select></label
            ><label>사번<input id="employeeId" readonly /></label
            ><label class="wide">구매처<input id="merchant" required /></label
            ><label>비용 분류<select id="category"></select></label
            ><label>세부 분류<input id="subcategory" /></label
            ><label class="wide">승인번호<input id="approvalNumber" /></label
            ><label class="wide">결제금액<input id="amount" type="number" step="1" min="0" required /></label
            ><button class="primary wide">확인 후 저장</button>
          </form>
        </div>
      </section>
      <section id="list" hidden>
        <div class="panel" style="overflow: auto">
          <table>
            <thead>
              <tr>
                <th>구매일시</th>
                <th>사용자</th>
                <th>구매처</th>
                <th>분류</th>
                <th>승인번호</th>
                <th>금액</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      // Apps Script에서 웹 앱으로 배포한 /exec 주소를 입력하세요.
      const BACKEND_URL = "https://script.google.com/macros/s/AKfycbw1Faxi5ZdRbLfbcdybAJLe-X7qFbR5iYoCOLhvtK0gI-2tjGEO9sAc3CEfXf_xv0J7/exec";

   
      let app = {};
      let image = "";

      const $ = (id) => document.getElementById(id);
      const won = (n) => Number(n || 0).toLocaleString("ko-KR") + "원";
      const DEPARTMENTS = ["담당", "팀장", "기획", "객실", "정비", "운항관리", "조종", "헬기"];
      let breakdownKey = "이름";

      function show(id, b) {
        ["dash", "scan", "list"].forEach((x) => ($(x).hidden = x !== id));
        document
          .querySelectorAll(".tabs button")
          .forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
      }
      function checkBackendUrl() {
        if (!BACKEND_URL.startsWith("https://script.google.com/macros/s/")) {
          throw new Error(
            "프론트 코드 상단의 BACKEND_URL에 Apps Script /exec 주소를 입력하세요.",
          );
        }
      }

      function jsonp(action, params = {}) {
        checkBackendUrl();
        return new Promise((resolve, reject) => {
          const callbackName =
            "receiptCallback_" +
            Date.now() +
            "_" +
            Math.random().toString(36).slice(2);
          const script = document.createElement("script");
          const timeout = setTimeout(() => {
            cleanup();
            reject(new Error("백엔드 응답 시간이 초과되었습니다."));
          }, 30000);

          function cleanup() {
            clearTimeout(timeout);
            delete window[callbackName];
            script.remove();
          }

          window[callbackName] = (response) => {
            cleanup();
            response.ok
              ? resolve(response)
              : reject(new Error(response.error || "요청에 실패했습니다."));
          };

          const query = new URLSearchParams({
            action,
            callback: callbackName,
            ...params,
          });
          script.onerror = () => {
            cleanup();
            reject(new Error("백엔드에 연결할 수 없습니다."));
          };
          script.src = BACKEND_URL + "?" + query.toString();
          document.head.appendChild(script);
        });
      }

      async function postJob(action, values) {
        checkBackendUrl();
        const requestId =
          Date.now().toString(36) + Math.random().toString(36).slice(2);
        const body = new URLSearchParams({
          action,
          requestId,
          ...values,
        });

        fetch(BACKEND_URL, {
          method: "POST",
          mode: "no-cors",
          body,
        }).catch(() => {});

        for (let i = 0; i < 180; i += 1) {
          await new Promise((resolve) => setTimeout(resolve, 700));
          const result = await jsonp("status", { requestId });
          if (result.state === "done") return result.data;
          if (result.state === "error") {
            throw new Error(result.error || "처리 중 오류가 발생했습니다.");
          }
        }
        throw new Error("처리 시간이 초과되었습니다. 다시 시도해 주세요.");
      }

      async function init() {
        try {
          const response = await jsonp("initial");
          const d = response.data;
          app = d;
          $("buyerName").innerHTML = d.employees
            .map(
              (e) =>
                '<option value="' +
                e.name +
                '">' +
                e.name +
                " / " +
                e.employeeId +
                " / " +
                e.department +
                "</option>",
            )
            .join("");
          $("category").innerHTML = d.categories
            .map((x) => "<option>" + x + "</option>")
            .join("");
          setupDashboardFilters();
          syncEmp();
          render(d);
        } catch (err) {
          alert(err.message);
        }
      }

      function syncEmp() {
        let e = app.employees?.find((x) => x.name == $("buyerName").value);
        if (e) $("employeeId").value = e.employeeId;
      }
      const escapeHtml = (value) =>
        String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      function uniqueValues(rows, key) {
        return [...new Set(rows.map((r) => String(r[key] || "")).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, "ko", { numeric: true }));
      }

      function fillFilter(id, values, allLabel) {
        $(id).innerHTML =
          '<option value="">' + allLabel + "</option>" +
          values.map((v) => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + "</option>").join("");
      }

      function setupDashboardFilters() {
        const rows = app.receipts || [];
        fillFilter("filterYear", uniqueValues(rows, "연도").reverse(), "전체 연도");
        fillFilter("filterMonth", Array.from({ length: 12 }, (_, i) => String(i + 1)), "전체 월");
        fillFilter("filterEmployee", uniqueValues(rows, "이름"), "전체 사용자");
        const departments = [...new Set([...DEPARTMENTS, ...uniqueValues(rows, "소속")])];
        fillFilter("filterDepartment", departments, "전체 소속");
        fillFilter("filterCategory", app.categories || [], "전체 분류");
      }

      function resetDashboardFilters() {
        ["filterYear", "filterMonth", "filterEmployee", "filterDepartment", "filterCategory"]
          .forEach((id) => ($(id).value = ""));
        applyDashboardFilters();
      }

      function filteredReceipts() {
        const year = $("filterYear").value;
        const month = $("filterMonth").value;
        const employee = $("filterEmployee").value;
        const department = $("filterDepartment").value;
        const category = $("filterCategory").value;
        return (app.receipts || []).filter((r) =>
          (!year || String(r["연도"]) === year) &&
          (!month || String(r["월"]) === month) &&
          (!employee || r["이름"] === employee) &&
          (!department || r["소속"] === department) &&
          (!category || r["비용대분류"] === category)
        );
      }

      function groupAmounts(rows, key) {
        return Object.entries(rows.reduce((group, row) => {
          const name = String(row[key] || "미분류");
          group[name] = (group[name] || 0) + Number(row["결제금액"] || 0);
          return group;
        }, {})).sort((a, b) => b[1] - a[1]);
      }

      function setBreakdown(key, button) {
        breakdownKey = key;
        document.querySelectorAll(".breakdown-tabs button").forEach((x) => x.classList.remove("on"));
        button.classList.add("on");
        closeBreakdownDetail();
        renderBreakdown(filteredReceipts());
      }

      function breakdownLabel(key, value) {
        if (key === "연도") return value + "년";
        if (key === "월") return value + "월";
        return value;
      }

      function renderBreakdown(rows) {
        let entries = groupAmounts(rows, breakdownKey);
        if (breakdownKey === "연도" || breakdownKey === "월") {
          entries.sort((a, b) => Number(a[0]) - Number(b[0]));
        }
        if (!entries.length) {
          $("breakdownChart").innerHTML = '<div class="empty">조건에 해당하는 데이터가 없습니다.</div>';
          return;
        }
        const max = Math.max(...entries.map((x) => Number(x[1]) || 0), 1);
        $("breakdownChart").innerHTML = entries.map(([value, amount]) => {
          const count = rows.filter((r) => String(r[breakdownKey] || "미분류") === String(value)).length;
          return '<div class="bar-row clickable" data-value="' + escapeHtml(value) + '"><span>' +
            escapeHtml(breakdownLabel(breakdownKey, value)) + ' <small>(' + count + '건)</small></span>' +
            '<div class="bar-track"><div class="bar-fill" style="width:' +
            Math.max(2, Math.round(Number(amount) / max * 100)) + '%"></div></div><b>' + won(amount) + "</b></div>";
        }).join("");
        $("breakdownChart").querySelectorAll(".clickable").forEach((row) => {
          row.addEventListener("click", () => showBreakdownDetail(row.dataset.value));
        });
      }

      function showBreakdownDetail(value) {
        const rows = filteredReceipts()
          .filter((r) => String(r[breakdownKey] || "미분류") === String(value))
          .sort((a, b) => Number(b["결제금액"] || 0) - Number(a["결제금액"] || 0));
        const titleMap = {
          이름: "사용자",
          소속: "부서",
          비용대분류: "비용분류",
          연도: "연도",
          월: "월",
        };
        $("breakdownDetailTitle").textContent =
          titleMap[breakdownKey] + " · " + breakdownLabel(breakdownKey, value) + " 영수증 내역";
        $("breakdownDetailRows").innerHTML = rows.map((r) =>
          "<tr><td>" + escapeHtml(r["구매일자"]) + " " + escapeHtml(r["구매시간"]) +
          "</td><td>" + escapeHtml(r["이름"]) + "</td><td>" + escapeHtml(r["소속"]) +
          "</td><td>" + escapeHtml(r["구매처"]) + "</td><td>" + escapeHtml(r["비용대분류"]) +
          "</td><td>" + escapeHtml(r["승인번호"]) + "</td><td><b>" + won(r["결제금액"]) + "</b></td></tr>"
        ).join("");
        $("breakdownDetail").hidden = false;
        $("breakdownDetail").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function closeBreakdownDetail() {
        $("breakdownDetail").hidden = true;
      }

      function drawBars(id, entries, colorClass = "", limit = 12) {
        const target = $(id);
        const list = entries.slice(0, limit);
        if (!list.length) {
          target.innerHTML = '<div class="empty">조건에 해당하는 데이터가 없습니다.</div>';
          return;
        }
        const max = Math.max(...list.map((x) => Number(x[1]) || 0), 1);
        target.innerHTML = list.map(([label, amount]) =>
          '<div class="bar-row"><span title="' + escapeHtml(label) + '">' + escapeHtml(label) +
          '</span><div class="bar-track"><div class="bar-fill ' + colorClass + '" style="width:' +
          Math.max(2, Math.round(Number(amount) / max * 100)) + '%"></div></div><b>' + won(amount) + "</b></div>"
        ).join("");
      }

      function applyDashboardFilters() {
        const rows = filteredReceipts();
        const total = rows.reduce((sum, r) => sum + Number(r["결제금액"] || 0), 0);
        $("total").textContent = won(total);
        $("count").textContent = rows.length + "건";
        closeBreakdownDetail();
        renderBreakdown(rows);

        const ranked = [...rows].sort((a, b) => Number(b["결제금액"] || 0) - Number(a["결제금액"] || 0));
        $("rankingRows").innerHTML = ranked.length
          ? ranked.map((r, i) => "<tr><td>" + (i + 1) + "</td><td>" + escapeHtml(r["구매일자"]) +
              "</td><td>" + escapeHtml(r["이름"]) + "</td><td>" + escapeHtml(r["소속"]) +
              "</td><td>" + escapeHtml(r["구매처"]) + "</td><td>" + escapeHtml(r["비용대분류"]) +
              "</td><td><b>" + won(r["결제금액"]) + "</b></td></tr>").join("")
          : '<tr><td colspan="7" class="empty">조건에 해당하는 데이터가 없습니다.</td></tr>';
      }

      function render(d) {
        applyDashboardFilters();
        $("rows").innerHTML = [...d.receipts]
          .sort((a, b) => String(b["구매일자"]).localeCompare(String(a["구매일자"])))
          .map(
            (r) =>
              "<tr><td>" +
              r["구매일자"] +
              " " +
              r["구매시간"] +
              "</td><td>" +
              r["이름"] +
              "<br>" +
              r["사번"] +
              "</td><td>" +
              r["구매처"] +
              "</td><td>" +
              r["비용대분류"] +
              "</td><td>" +
              r["승인번호"] +
              "</td><td>" +
              won(r["결제금액"]) +
              "</td></tr>",
          )
          .join("");
      }
      async function compressImage(file) {
        const source = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const img = await new Promise((resolve, reject) => {
          const element = new Image();
          element.onload = () => resolve(element);
          element.onerror = reject;
          element.src = source;
        });
        const maxSize = 1800;
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas
          .getContext("2d")
          .drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL("image/jpeg", 0.82);
      }

      file.onchange = async (e) => {
        const selectedFile = e.target.files[0];
        if (!selectedFile) return;
        try {
          image = await compressImage(selectedFile);
          photo.innerHTML = '<img src="' + image + '"><p>AI 분석 중…</p>';
          const x = await postJob("analyze", { image });
          Object.entries(x).forEach(([k, v]) => {
            if ($(k) && v !== undefined) $(k).value = v;
          });
          syncEmp();
          photo.querySelector("p").textContent = "분석 완료";
        } catch (err) {
          photo.querySelector("p").textContent = "분석 실패";
          alert(err.message);
        }
      };

      async function save(e) {
        e.preventDefault();
        const x = {};
        [
          "purchaseDate",
          "purchaseTime",
          "buyerName",
          "employeeId",
          "merchant",
          "category",
          "subcategory",
          "approvalNumber",
          "amount",
        ].forEach((k) => (x[k] = $(k).value));

        try {
          await postJob("save", {
            payload: JSON.stringify(x),
          });
          alert("저장했습니다.");
          location.reload();
        } catch (err) {
          alert(err.message);
        }
      }

      init();
    </script>
  </body>
</html>
